name: Photo Refiner CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install runtime test dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless pyyaml

      - name: Core unit tests
        run: python -m unittest discover -s skills/photo-refiner/tests

      - name: Creative contract
        run: python tests/creative_contract.py

      - name: HD route contract
        run: python tests/route_contract.py

      - name: Settings MCP contract
        run: node tests/plugin_contract.cjs

      - name: Workflow MCP contract
        run: node tests/workflow_plugin_contract.cjs

      - name: Widget contract
        run: node tests/widget_contract.cjs

      - name: Portable layout contract
        run: python tests/portable_layout.py

      - name: Build validation
        run: python distribution/build_plugin.py --check
