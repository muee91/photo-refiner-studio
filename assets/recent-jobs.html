<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="color-scheme" content="dark"/><title>Photo Refiner 最近任务</title><style>
:root{color-scheme:dark;--bg:#070908;--panel:#0d1110;--ink:#eef0ea;--muted:#98a19a;--line:rgba(255,255,255,.11);--teal:#3fc3ac;--teal-bg:rgba(28,136,120,.16)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,'PingFang SC','Segoe UI',sans-serif}.wrap{max-width:820px;margin:auto;padding:16px}.head{margin-bottom:12px}.head small{color:var(--teal);font-weight:750;letter-spacing:.12em}.head h1{font-size:20px;margin:4px 0}.head p{color:var(--muted);margin:0}.list{display:grid;gap:8px}.job{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:13px}.job.active{background:linear-gradient(90deg,var(--teal-bg),transparent 45%),var(--panel)}.title{font-weight:760}.meta{color:var(--muted);font-size:12px;margin-top:3px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;margin-right:5px;color:var(--muted)}button{border:1px solid rgba(63,195,172,.45);border-radius:999px;background:var(--teal-bg);color:var(--teal);padding:9px 15px;min-height:40px;font:inherit;font-weight:720;cursor:pointer}button:disabled{opacity:.45;cursor:wait}.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center}.status{color:var(--muted);font-size:12px;margin-top:10px}@media(max-width:600px){.job{grid-template-columns:1fr}.job button{width:100%}}</style></head><body><div class="wrap"><div class="head"><small>PHOTO REFINER · RECENT</small><h1>继续最近任务</h1><p>恢复的是 job.json 的真实状态，不依赖之前聊天还记得什么。</p></div><div class="list" id="list"></div><div class="status" id="status" role="status"></div></div>
<script id="initial" type="application/json">__PHOTO_REFINER_JOBS_PAYLOAD__</script><script>
const payload=(()=>{try{return JSON.parse(document.getElementById('initial').textContent)}catch{return{jobs:[]}}})();const state={id:0,pending:new Map()};const list=document.getElementById('list');const status=document.getElementById('status');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bridgeRequest(method,params){const id=++state.id;window.parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{state.pending.delete(id);reject(new Error('宿主未响应'))},20000);state.pending.set(id,{resolve,reject,timer})})}window.addEventListener('message',e=>{if(e.source!==window.parent)return;const m=e.data;if(!m||m.jsonrpc!=='2.0'||!state.pending.has(m.id))return;const p=state.pending.get(m.id);state.pending.delete(m.id);clearTimeout(p.timer);m.error?p.reject(new Error(m.error.message)):p.resolve(m.result)});function request(name,args){if(window.openai?.callTool)return window.openai.callTool({name,arguments:args}).then(v=>v||bridgeRequest('tools/call',{name,arguments:args}),()=>bridgeRequest('tools/call',{name,arguments:args}));return bridgeRequest('tools/call',{name,arguments:args})}
const labels={initialized:'刚建立',prepared:'准备完成',base_generated:'等待/处理主图',details_processed:'细节已完成',creative_generated:'等待/处理创意',completed:'已完成',failed:'失败'};function render(){const jobs=payload.jobs||[];if(!jobs.length){list.innerHTML='<div class="empty">还没有可恢复的 Photo Refiner 任务。</div>';return}list.innerHTML='';for(const job of jobs){const card=document.createElement('div');card.className='job '+(job.active?'active':'');card.innerHTML=`<div><div class="title">${esc(job.title)}</div><div class="meta"><span class="badge">${esc(labels[job.status]||job.status)}</span>${job.workflow==='batch'?`<span class="badge">${esc(job.frameCount||0)} 张</span>`:''}${esc(job.updatedAt||'')}</div></div>`;const b=document.createElement('button');b.type='button';b.textContent=job.active?'继续':'查看';b.addEventListener('click',()=>resume(job,b));card.appendChild(b);list.appendChild(card)}}async function resume(job,button){button.disabled=true;status.textContent='正在恢复任务状态…';try{const result=await request('resume_photo_refiner_job',{jobPath:job.jobPath});const out=result?.structuredContent||JSON.parse(result?.content?.[0]?.text||'{}');if(!out.ok)throw new Error(out.error||'恢复失败');status.textContent=`已恢复：${out.decision?.visible_status||''}`;const message=`PHOTO_REFINER_JOB_RESUMED\njobPath: ${out.jobPath}\nnextAction: ${out.decision?.next_action||''}\n\n请从这个 job.json 的真实状态继续，不要重新打开设置，也不要重新生成已经存在且有效的阶段。`;if(window.openai?.sendFollowUpMessage)await window.openai.sendFollowUpMessage({prompt:message});else await bridgeRequest('ui/message',{role:'user',content:[{type:'text',text:message}]})}catch(e){button.disabled=false;status.textContent=`恢复失败：${e.message}`}}render();
</script></body></html>
